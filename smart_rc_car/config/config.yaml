# ============================================================
#  Smart RC Car — Central Configuration
#  Edit this file to match your wiring and preferences.
#  All GPIO numbers are BCM (Broadcom) numbering.
# ============================================================

# -----------------------------------------------------------
# Motor Driver (L298N)
# -----------------------------------------------------------
motors:
  driver: l298n

  # Left motor (Motor A on L298N)
  left:
    ena_pin: 12        # PWM-capable GPIO (hardware PWM)
    in1_pin: 23        # Direction A
    in2_pin: 24        # Direction B

  # Right motor (Motor B on L298N)
  right:
    enb_pin: 13        # PWM-capable GPIO (hardware PWM)
    in3_pin: 27        # Direction A
    in4_pin: 22        # Direction B

  # PWM frequency in Hz (1000 Hz is smooth for DC motors)
  pwm_frequency: 1000

  # Maximum allowable duty cycle (0.0 – 1.0)
  # Reduce to limit top speed (e.g. 0.7 = 70% of motor supply)
  max_duty_cycle: 0.80

  # Minimum duty cycle needed to overcome motor stiction (dead-zone)
  min_duty_cycle: 0.15

  # Acceleration ramp: max change in duty per control cycle
  # (prevents sudden jerks; 0.05 = 5% per cycle at 30 Hz)
  ramp_rate: 0.06

# -----------------------------------------------------------
# FlySky FS-R6B Receiver (individual PWM channels via pigpio)
# -----------------------------------------------------------
receiver:
  # One GPIO pin per channel
  channels:
    ch1_steering: 17   # CH1 — Steering
    ch2_throttle: 18   # CH2 — Throttle
    ch3_mode:     25   # CH3 — Manual / Auto-Assist switch
    ch4_aux1:     null # CH4 — spare
    ch5_aux2:     null # CH5 — spare
    ch6_aux3:     null # CH6 — spare

  # PWM signal range from receiver (microseconds)
  pwm_min_us: 1000
  pwm_max_us: 2000
  pwm_center_us: 1500

  # Joystick deadband (±µs around center to ignore)
  deadband_us: 30

  # If no valid pulse within this time, trigger SIGNAL_LOST failsafe
  signal_loss_timeout_s: 0.25

  # CH3 threshold: below → MANUAL, above → AUTO-ASSIST
  mode_switch_threshold_us: 1500

# -----------------------------------------------------------
# Camera
# -----------------------------------------------------------
camera:
  # 0 = first USB webcam. Use 1, 2 … if multiple cameras
  device_index: 0

  # Capture resolution (lower = faster inference)
  width: 640
  height: 480
  fps: 30

  # Camera calibration file (generated by calibration.py)
  calibration_file: config/camera_cal.npz
  apply_undistort: false  # Enable after running calibration

  # Flip image if camera is mounted upside-down
  flip_horizontal: false
  flip_vertical: false

# -----------------------------------------------------------
# Vision
# -----------------------------------------------------------
vision:
  # YOLO model: yolov8n.pt (nano, fastest) or yolov8s.pt (small)
  yolo_model: yolov8n.pt
  yolo_confidence: 0.45
  yolo_iou: 0.45

  # Inference resolution fed to YOLO (smaller = faster)
  yolo_input_size: 320

  # Classes of interest (COCO class IDs — null = all classes)
  # 0=person, 56=chair, 57=couch, 60=dining table, 62=tv,
  # 63=laptop, 67=cell phone, 73=book, 76=scissors, 79=toothbrush
  yolo_target_classes: null

  # Zone split ratios (left_fraction + center_fraction + right_fraction = 1.0)
  zone_left_fraction: 0.33
  zone_center_fraction: 0.34
  zone_right_fraction: 0.33

  # Vertical ROI: only analyze bottom N% of frame (road-level)
  roi_top_fraction: 0.35   # ignore top 35% (sky / far distance)

  # Obstacle is BLOCKED if bounding-box occupies more than this
  # fraction of the zone width
  block_threshold: 0.30

  # Depth estimation method: "bbox" (default) or "midas"
  depth_method: bbox

  # Danger distance in meters — triggers collision prevention
  danger_distance_m: 0.80
  warning_distance_m: 1.50

  # Ramp detection
  ramp_angle_threshold_deg: 8.0   # minimum slope angle to detect ramp

# -----------------------------------------------------------
# Navigation / Auto-Assist
# -----------------------------------------------------------
navigation:
  # Speed when approaching obstacle (fraction of driver command)
  caution_speed_factor: 0.50

  # Steering correction when dodging (normalized -1 to +1)
  dodge_steer_amount: 0.60

  # How many consecutive frames obstacle must appear before dodging
  obstacle_confirm_frames: 3

  # How long to keep dodging after obstacle leaves frame (seconds)
  dodge_hold_s: 0.8

  # Return-to-center steering blending speed (1.0 = instant, 0.05 = very slow)
  return_blend_rate: 0.08

# -----------------------------------------------------------
# Safety / Watchdog
# -----------------------------------------------------------
safety:
  # Watchdog must be kicked every N seconds or motors stop
  watchdog_timeout_s: 1.0

  # Emergency stop re-arm: must be explicitly reset after trigger
  require_rearm: false

# -----------------------------------------------------------
# Web Dashboard
# -----------------------------------------------------------
dashboard:
  enabled: true
  host: "0.0.0.0"    # Listen on all interfaces (accessible from network)
  port: 5000
  mjpeg_quality: 80  # JPEG quality 1-100 for video stream

# -----------------------------------------------------------
# Logging
# -----------------------------------------------------------
logging:
  level: INFO          # DEBUG / INFO / WARNING / ERROR
  log_file: logs/rc_car.log
  max_bytes: 5242880   # 5 MB
  backup_count: 3
